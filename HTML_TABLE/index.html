<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML TABLE Practice Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { color: #0f172a; margin-bottom: 25px; font-size: 1.8rem; text-align: center; }
        .button-container { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 320px; }
        .btn {
            display: block;
            text-decoration: none;
            text-align: center;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: all 0.2s ease-in-out;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 15px -3px rgba(0,0,0,0.15); filter: brightness(1.08); }
        .btn:active { transform: translateY(0); }

        .btn-normal { background-color: #3b82f6; }   /* Blue */
        .btn-colspan { background-color: #10b981; }  /* Green */
        .btn-rowspan { background-color: #f59e0b; }  /* Amber */
        .btn-nested { background-color: #8b5cf6; }   /* Purple */
    </style>
</head>
<body>

    <h1>HTML Table Practice Modules</h1>

    <div class="button-container">
        <a href="./components/normal_table.html" rel="noopener noreferrer" class="btn btn-normal">Normal Table</a>
        <a href="./components/col_span.html" rel="noopener noreferrer" class="btn btn-colspan">Column Span (colspan)</a>
        <a href="./components/row_span.html" rel="noopener noreferrer" class="btn btn-rowspan">Row Span (rowspan)</a>
        <a href="./components/nested_table.html" rel="noopener noreferrer" class="btn btn-nested">Nested Table</a>
    </div>

</body>
</html>
