<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Section</title>
</head>
<body>

    <h2>Contact Me</h2>

    <p>You can reach me through any of the following:</p>

    <ul>
        <li><b>Email:</b> <a href="mailto:john@example.com">john@example.com</a></li>
        <li><b>Phone:</b> <a href="tel:+15550199">+1 555-0199</a></li>
        <li><b>Website:</b> <a href="https://example.com" target="_blank" rel="noopener">example.com</a></li>
    </ul>

    <h3>Send a Message</h3>

    <form action="#" method="get">
        <p>
            <label for="name">Your Name:</label><br>
            <input type="text" id="name" name="name" placeholder="John Doe">
        </p>
        <p>
            <label for="email">Your Email:</label><br>
            <input type="email" id="email" name="email" placeholder="john@example.com">
        </p>
        <p>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="40" placeholder="Write your message here..."></textarea>
        </p>
        <p>
            <input type="submit" value="Send Message">
            <input type="reset" value="Clear">
        </p>
    </form>

    <hr>

</body>
</html>
