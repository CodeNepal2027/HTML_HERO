<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map Section</title>
</head>
<body>

    <h2>Find Me Here</h2>

    <p>I'm based in Kathmandu, Nepal. Here's a map of the area:</p>

    <iframe
        src="https://www.google.com/maps?q=Kathmandu,Nepal&output=embed"
        title="Google Map of Kathmandu"
        width="100%"
        height="300"
        frameborder="0"
        scrolling="no"
        loading="lazy">
    </iframe>

    <h3>Address</h3>

    <address>
        John Doe<br>
        Kathmandu, Bagmati Province<br>
        Nepal<br>
        <a href="mailto:john@example.com">john@example.com</a>
    </address>

    <hr>

</body>
</html>
