<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule</title>
</head>
<body>

    <h2>My Weekly Learning Schedule</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th rowspan="2">Day</th>
                <th colspan="2">Time</th>
                <th rowspan="2">Subject / Topic</th>
            </tr>
            <tr>
                <th>Start Time</th>
                <th>End Time</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Saturday</td>
                <td>11:00 AM</td>
                <td>12:00 AM</td>
                <td>HTML Basics & Tags</td>
            </tr>
            <tr>
                <td>Sunday</td>
                <td>02:00 PM</td>
                <td>03:00 PM</td>
                <td>HTML Forms & Tables</td>
            </tr>
            <tr>
                <td>Other day</td>
                <td>7:00 pM</td>
                <td>9:00 PM</td>
                <td>Portfolio Project Practice</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
