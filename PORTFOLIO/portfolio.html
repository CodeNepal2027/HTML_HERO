<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- OPTECH Favicon (one level up) -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <!-- Bootstrap Icons 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>HTML HERO || Portfolio Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            color: #0f172a;
            padding: 24px 20px 48px 20px;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 25px;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        h1 i {
            color: #F54927;
            font-size: 1.5rem;
        }

        /* Container for navigation buttons */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 340px;
        }

        /* Base Button Styles */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            text-align: center;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
        }

        .btn i {
            font-size: 1.1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.15);
            filter: brightness(1.08);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Individual Button Colors */
        .btn-p1 {
            background-color: #3b82f6; /* Blue */
        }

        .btn-p2 {
            background-color: #10b981; /* Emerald Green */
        }

        .btn-p3 {
            background-color: #f59e0b; /* Amber/Orange */
        }

        .btn-p4 {
            background-color: #8b5cf6; /* Purple */
        }
    </style>
</head>
<body>

    <h1>
        <i class="bi bi-person-badge"></i> Portfolio Practice
    </h1>

    <div class="button-container">
        <!-- Portfolio 1 -->
        <a href="./PORTFOLIO_1/portfolio_1.html" rel="noopener noreferrer" class="btn btn-p1">
            <i class="bi bi-1-circle"></i> Portfolio 1
        </a>

        <!-- Portfolio 2 -->
        <a href="./PORTFOLIO_2/portfolio_2.html" rel="noopener noreferrer" class="btn btn-p2">
            <i class="bi bi-2-circle"></i> Portfolio 2
        </a>

        <!-- Add more portfolios below by un-commenting and adjusting the number / link / class -->
        <!--
        <a href="./PORTFOLIO_3/index.html" rel="noopener noreferrer" class="btn btn-p3">
            <i class="bi bi-3-circle"></i> Portfolio 3
        </a>
        <a href="./PORTFOLIO_4/index.html" rel="noopener noreferrer" class="btn btn-p4">
            <i class="bi bi-4-circle"></i> Portfolio 4
        </a>
        -->
    </div>

</body>
</html>
